{{ define "main" }}
<article>
  <div class="article-top"><span class="eyebrow">{{ .Params.kicker | default "THE BOOK" }}</span></div>
  <h1>{{ .Title }}</h1>
  {{ with .Params.duration }}<p class="duration">{{ . }} · At your own pace</p>{{ end }}
  {{ with .Params.description }}<p class="lede">{{ . }}</p>{{ end }}
  {{ if .Params.toc }}<details class="lesson-map"><summary>In this lesson</summary>{{ .TableOfContents }}</details>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
