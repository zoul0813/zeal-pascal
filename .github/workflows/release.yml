name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (for example 1.0.0 or v1.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Serialize versions so two dispatches cannot publish the same version together.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select latest successful build artifact
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release.py select --version "$RELEASE_VERSION"

      - name: Download the selected artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-artifact
          merge-multiple: true

      - name: Tag built commit and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.select.outputs.commit }}
          RELEASE_RUN_URL: ${{ steps.select.outputs.run_url }}
        run: |
          python3 .github/scripts/release.py publish \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --run-url "$RELEASE_RUN_URL" --archive release-artifact/zeal-pascal.zip
