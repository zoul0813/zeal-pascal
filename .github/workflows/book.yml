name: Book preview
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the pilot to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: book-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
      - name: Check sources and workspace behavior
        run: |
          python3 book/scripts/prepare.py --downloads-only
          python3 book/scripts/check.py
          node --test book/tests/*.test.mjs
      - name: Build with project base path
        run: hugo --source book --minify --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/public
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
