name: Build distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: zeal-pascal
    env:
      ZDE_USE: docker
      ZDE_STRICT_EXIT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: zeal-pascal
          persist-credentials: false

      - name: Set up ZDE
        uses: zoul0813/zeal-dev-environment/github/setup-zde@main
        with:
          path: zeal-dev-environment
          deps: Zeal8bit/Zeal-NativeEmulator

      - name: Test build and release helpers
        run: |
          zde --no-tty exec python3 -m unittest discover -s tests -p test_compile_unit.py
          zde --no-tty exec python3 -m unittest discover -s tests -p test_zeal_emulator.py
          zde --no-tty exec python3 -m unittest discover -s tests -p test_release.py
          zde --no-tty exec python3 -m unittest discover -s tests -p test_stage_distribution.py

      - name: Build hardware distribution
        run: zde --no-tty make dist JOBS=6

      - name: Package hardware files and examples
        run: |
          zip -r "$RUNNER_TEMP/zeal-pascal.zip" bin examples
          echo "Built commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: zeal-pascal-dist
          path: ${{ runner.temp }}/zeal-pascal.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Retain failed compiler logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-compiler-logs-${{ github.run_attempt }}
          path: |
            zeal-pascal/build/unit-runs/*/compile-unit/*.txt
            zeal-pascal/build/unit-runs/*/compile-unit/input-error.json
          if-no-files-found: ignore
          retention-days: 7
